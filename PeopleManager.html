<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      margin: 0;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid #007bff;
    }
    .modal-header h3 {
      margin: 0;
      color: #333;
    }
    .close-btn {
      background: #6c757d;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    .close-btn:hover {
      background: #5a6268;
    }
    .people-list {
      max-height: 280px;
      overflow-y: auto;
      margin-bottom: 20px;
    }
    .person-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      margin-bottom: 8px;
      background: #f5f5f5;
      border-radius: 4px;
      border: 1px solid #ddd;
    }
    .person-info {
      flex: 1;
    }
    .person-name {
      font-weight: bold;
      margin-bottom: 2px;
    }
    .person-rate {
      color: #666;
      font-size: 13px;
    }
    .resource-type-badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 600;
      margin-left: 6px;
    }
    .resource-type-person {
      background: #d1ecf1;
      color: #0c5460;
    }
    .resource-type-cost {
      background: #d4edda;
      color: #155724;
    }
    .delete-btn {
      background: #dc3545;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .delete-btn:hover {
      background: #c82333;
    }
    .add-section {
      padding: 15px;
      background: #e7f3ff;
      border-radius: 4px;
      border: 1px solid #007bff;
    }
    .add-section h4 {
      margin-top: 0;
      margin-bottom: 15px;
      color: #007bff;
    }
    .add-section input,
    .add-section select {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    .add-btn {
      background: #28a745;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      font-size: 14px;
    }
    .add-btn:hover {
      background: #218838;
    }
    #message {
      padding: 10px;
      margin-top: 10px;
      border-radius: 4px;
      display: none;
    }
    .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .empty-state {
      text-align: center;
      padding: 30px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="modal-header">
    <h3>Manage Resources</h3>
    <button class="close-btn" onclick="google.script.host.close()">Close</button>
  </div>

  <div id="peopleList" class="people-list"></div>

  <div class="add-section">
    <h4>Add New Resource</h4>
    <select id="newResourceType">
      <option value="Person/Role">Person/Role</option>
      <option value="Direct Cost">Direct Cost</option>
    </select>
    <input type="text" id="newPersonName" placeholder="Name (e.g., Aaron or Software License)">
    <input type="number" id="newPersonRate" step="0.01" placeholder="Rate/Unit Cost">
    <button class="add-btn" onclick="addPerson()">Add Resource</button>
  </div>

  <div id="message"></div>

  <script>
    loadPeople();

    function loadPeople() {
      google.script.run
        .withSuccessHandler(displayPeople)
        .withFailureHandler(onError)
        .getAllPeopleRoles();
    }

    function displayPeople(people) {
      var container = document.getElementById('peopleList');

      if (people.length === 0) {
        container.innerHTML = '<div class="empty-state">No resources added yet.</div>';
        return;
      }

      container.innerHTML = '';
      people.forEach(function(person) {
        var typeBadgeClass = person.type === 'Direct Cost' ? 'resource-type-cost' : 'resource-type-person';
        var typeBadgeText = person.type === 'Direct Cost' ? 'Cost' : 'Person';

        var div = document.createElement('div');
        div.className = 'person-item';
        div.innerHTML =
          '<div class="person-info">' +
            '<div class="person-name">' +
              person.person +
              '<span class="resource-type-badge ' + typeBadgeClass + '">' + typeBadgeText + '</span>' +
            '</div>' +
            '<div class="person-rate">Rate: $' + parseFloat(person.rate).toFixed(2) + '</div>' +
          '</div>' +
          '<button class="delete-btn" onclick="deletePerson(' + person.id + ')">Delete</button>';
        container.appendChild(div);
      });
    }

    function addPerson() {
      var name = document.getElementById('newPersonName').value.trim();
      var rate = document.getElementById('newPersonRate').value;
      var type = document.getElementById('newResourceType').value;

      if (!name || !rate) {
        showMessage('Please enter both name and rate', 'error');
        return;
      }

      google.script.run
        .withSuccessHandler(function() {
          document.getElementById('newPersonName').value = '';
          document.getElementById('newPersonRate').value = '';
          document.getElementById('newResourceType').value = 'Person/Role';
          showMessage('Resource added successfully!', 'success');
          loadPeople();
        })
        .withFailureHandler(onError)
        .addPersonRole(name, rate, type);
    }

    function deletePerson(id) {
      if (!confirm('Are you sure you want to delete this resource?')) {
        return;
      }

      google.script.run
        .withSuccessHandler(function() {
          showMessage('Resource deleted successfully!', 'success');
          loadPeople();
        })
        .withFailureHandler(onError)
        .deletePersonRole(id);
    }

    function onError(error) {
      showMessage('Error: ' + error.message, 'error');
    }

    function showMessage(msg, type) {
      var messageDiv = document.getElementById('message');
      messageDiv.textContent = msg;
      messageDiv.className = type;
      messageDiv.style.display = 'block';
      setTimeout(function() {
        messageDiv.style.display = 'none';
      }, 5000);
    }
  </script>
</body>
</html>
