<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      margin: 0;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid #007bff;
    }
    .modal-header h3 {
      margin: 0;
      color: #333;
    }
    .close-btn {
      background: #6c757d;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    .close-btn:hover {
      background: #5a6268;
    }
    .options-list {
      max-height: 280px;
      overflow-y: auto;
      margin-bottom: 20px;
    }
    .option-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      margin-bottom: 8px;
      background: #f5f5f5;
      border-radius: 4px;
      border: 1px solid #ddd;
    }
    .option-percentage {
      font-weight: bold;
      font-size: 16px;
      flex: 1;
    }
    .delete-btn {
      background: #dc3545;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .delete-btn:hover {
      background: #c82333;
    }
    .add-section {
      padding: 15px;
      background: #e7f3ff;
      border-radius: 4px;
      border: 1px solid #007bff;
    }
    .add-section h4 {
      margin-top: 0;
      margin-bottom: 15px;
      color: #007bff;
    }
    .add-section input {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    .add-btn {
      background: #28a745;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      font-size: 14px;
    }
    .add-btn:hover {
      background: #218838;
    }
    #message {
      padding: 10px;
      margin-top: 10px;
      border-radius: 4px;
      display: none;
    }
    .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .empty-state {
      text-align: center;
      padding: 30px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="modal-header">
    <h3>Manage Escalation Rates</h3>
    <button class="close-btn" onclick="google.script.host.close()">Close</button>
  </div>

  <div id="optionsList" class="options-list"></div>

  <div class="add-section">
    <h4>Add New Escalation Rate</h4>
    <input type="number" id="newOptionPercentage" step="0.1" placeholder="Percentage (e.g., 3 for 3%)">
    <button class="add-btn" onclick="addOption()">Add Escalation Rate</button>
  </div>

  <div id="message"></div>

  <script>
    loadOptions();

    function loadOptions() {
      google.script.run
        .withSuccessHandler(displayOptions)
        .withFailureHandler(onError)
        .getAllEscalationOptions();
    }

    function displayOptions(options) {
      var container = document.getElementById('optionsList');

      if (options.length === 0) {
        container.innerHTML = '<div class="empty-state">No escalation rates added yet.</div>';
        return;
      }

      container.innerHTML = '';
      for (var i = 0; i < options.length; i++) {
        var opt = options[i];
        var div = document.createElement('div');
        div.className = 'option-item';
        div.innerHTML =
          '<div class="option-percentage">' + opt.percentage + '%</div>' +
          '<button class="delete-btn" onclick="deleteOption(' + opt.id + ')">Delete</button>';
        container.appendChild(div);
      }
    }

    function addOption() {
      var percentage = document.getElementById('newOptionPercentage').value;

      if (!percentage) {
        showMessage('Please enter a percentage', 'error');
        return;
      }

      google.script.run
        .withSuccessHandler(function() {
          document.getElementById('newOptionPercentage').value = '';
          showMessage('Escalation rate added successfully!', 'success');
          loadOptions();
        })
        .withFailureHandler(onError)
        .addEscalationOption(percentage);
    }

    function deleteOption(id) {
      if (!confirm('Are you sure you want to delete this escalation rate?')) {
        return;
      }

      google.script.run
        .withSuccessHandler(function() {
          showMessage('Escalation rate deleted successfully!', 'success');
          loadOptions();
        })
        .withFailureHandler(onError)
        .deleteEscalationOption(id);
    }

    function onError(error) {
      showMessage('Error: ' + error.message, 'error');
    }

    function showMessage(msg, type) {
      var messageDiv = document.getElementById('message');
      messageDiv.textContent = msg;
      messageDiv.className = type;
      messageDiv.style.display = 'block';
      setTimeout(function() {
        messageDiv.style.display = 'none';
      }, 5000);
    }
  </script>
</body>
</html>
